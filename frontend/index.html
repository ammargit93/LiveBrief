<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LiveBrief - Interactive agentic document intelligence dashboard that compiles and maintains a living software project brief." />
    
    <title>LiveBrief - Project Intelligence Brief</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                bg: '#f8fafc',
                card: '#ffffff',
                cardBorder: '#cbd5e1',
                text: '#0f172a',
                textMuted: '#475569',
                accent: '#0f172a', // Clean black/slate for professional buttons
                accentHover: '#1e293b',
                success: '#16a34a',
                danger: '#dc2626',
                warning: '#ea580c'
              }
            }
          }
        }
      }
    </script>
    
    <style>
      body {
        background-color: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', sans-serif;
      }
      .card-border {
        border: 1px solid #cbd5e1;
      }
    </style>
  </head>
  <body class="bg-brand-bg text-brand-text min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
