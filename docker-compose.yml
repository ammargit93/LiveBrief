version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: livebrief-db
    environment:
      POSTGRES_USER: ammar
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: livebrief
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ammar -d livebrief"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livebrief-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://ammar:password123@db:5432/livebrief
      SYNC_DATABASE_URL: postgresql://ammar:password123@db:5432/livebrief
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "uv run python -m backend.app.init_db && uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livebrief-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
